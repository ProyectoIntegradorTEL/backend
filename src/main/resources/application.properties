# NO DOCKER
spring.datasource.url=jdbc:postgresql://localhost:5432/local_pds
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.tomcat.max-active=10
spring.datasource.driver-class-name=org.postgresql.Driver

# Communication
server.address=0.0.0.0

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
jwt.secret=my-secret-key
server.port=8081
# creacion automatica de tablas
spring.jpa.hibernate.ddl-auto=update

# JPA (opt)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web.socket=DEBUG
logging.level.org.springframework.messaging=DEBUG
logging.level.org.springframework.messaging.simp=DEBUG
logging.level.org.springframework.messaging.simp.broker.SimpleBrokerMessageHandler=TRACE
logging.level.org.springframework.messaging.simp.user.DefaultSimpUserRegistry=TRACE

logging.level.org.springframework.simp=DEBUG
logging.level.org.springframework.web.socket.messaging=DEBUG
logging.level.org.springframework.web.socket.handler.LoggingWebSocketHandlerDecorator=DEBUG
